[workspace]
members = [
    "crates/hololive-app",
    "crates/hololive-core",
    "crates/hololive-simulation",
    "crates/temscript-client",
    "crates/temscript-simulator",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.95"

[workspace.dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
flate2 = "1.1.10"
num-complex = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2.19"
png = "0.18.1"
rand = "0.10.3"
rand_distr = "0.6.0"
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "gzip", "json", "query", "rustls"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiny_http = "0.12.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
lto = false
codegen-units = 256
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 0
strip = "debuginfo"
incremental = false
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
lto = false
